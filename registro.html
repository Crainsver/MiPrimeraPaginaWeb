<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Tienda</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Aquí puedes copiar tu <nav> del index.html -->

    <main style="padding: 60px 20px; background-color: #f9f9f9; min-height: 70vh;">
        <div class="admin-container">
            <h2>Crea tu Cuenta</h2>
            <form id="formRegistro">
                <div class="campo">
                    <label for="regNombre">Nombre Completo</label>
                    <input type="text" id="regNombre" placeholder="Ej: Jane Doe">
                    <span class="error" id="errorRegNombre"></span>
                </div>
                
                <div class="campo">
                    <label for="regEmail">Correo Electrónico</label>
                    <input type="email" id="regEmail" placeholder="ejemplo@correo.com">
                    <span class="error" id="errorRegEmail"></span>
                </div>
                
                <div class="campo">
                    <label for="regPassword">Contraseña</label>
                    <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres">
                    <span class="error" id="errorRegPassword"></span>
                </div>
                
                <button type="submit" class="btn-submit">REGISTRARSE</button>
                <div class="exito" id="mensajeRegExito"></div>
            </form>
        </div>
    </main>

    <!-- Aquí puedes copiar tu <footer> -->
    <script src="script.js"></script>
</body>
</html>
