<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gymshark Clone - Favoritos</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="promo-bar">
            <p><u>Obtén un 10 % de descuento en tu primer pedido al suscribirte a nuestros correos</u></p>
        </div>
        <nav class="main-nav">
            <div class="nav-left">
                <a href="mujer.html">Mujeres</a>
                <a href="hombre.html">Hombre</a>
                <a href="accesorios.html">Accesorios</a>
            </div>
            <div class="nav-center">
                <a href="index.html" style="text-decoration: none; color: black;"><h1>GYMSHARK</h1></a>
            </div>
            <div class="nav-right">
                <div class="search-bar">
                    <span class="icon">🔍</span>
                    <input type="text" id="buscador" placeholder="Buscar...">
                </div>
                <div class="icons">
                    <span style="cursor:pointer; color: #d0021b;" title="Mis Favoritos">❤️</span>
                    <a href="perfil.html" style="text-decoration: none; color: black;" title="Mi Perfil"><span>👤</span></a>
                    <span style="cursor:pointer;" id="icono-bolsa" title="Mi Bolsa">🛍️</span>
                    <span id="contador-carrito" class="cart-counter">0</span>
                </div>
            </div>
        </nav>
    </header>

    <main class="carrito-main">
        <div class="carrito-container">
            <h2>MIS FAVORITOS ❤️</h2>
            <p style="margin-bottom: 20px; font-weight: 600; font-size: 0.9rem;">Los artículos que te encantan, guardados en un solo lugar.</p>
            
            <div class="grid-productos">
                <!-- Producto Favorito Fijo de Ejemplo -->
                <article class="producto-card">
                    <div class="img-container">
                        <span class="heart-icon" style="color: #d0021b;">❤️</span>
                        <img src="https://images.unsplash.com/photo-1581655353564-df123a1eb820?w=500&q=80" alt="Favorito 1">
                    </div>
                    <div class="producto-info">
                        <h3>Camiseta Vital Seamless</h3>
                        <p class="precio">$24.990</p>
                        <button class="btn-agregar-carrito" data-nombre="Camiseta Vital Seamless" data-precio="24990">Mover a la bolsa</button>
                    </div>
                </article>
            </div>

            <div style="margin-top: 40px;">
                <button onclick="window.location.href='index.html'" class="btn-volver" style="width: 100%;">← Volver a la Tienda</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 GYMSHARK CLONE. PARA FINES EDUCATIVOS.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
