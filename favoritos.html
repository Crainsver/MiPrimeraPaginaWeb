<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FITSHARK - Favoritos</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="promo-bar">
            <p><u>Obtén un 10 % de descuento en tu primer pedido al suscribirte a nuestros correos</u></p>
        </div>
        <nav class="main-nav">
            <div class="nav-left">
                <a href="mujer.html">Mujeres</a>
                <a href="hombre.html">Hombre</a>
                <a href="accesorios.html">Accesorios</a>
            </div>
            <div class="nav-center">
                <a href="index.html" style="text-decoration: none; color: black;"><h1>GYMSHARK</h1></a>
            </div>
            <div class="nav-right">
                <div class="search-bar">
                    <span class="icon">🔍</span>
                    <input type="text" id="buscador" placeholder="Buscar...">
                </div>
                <div class="icons">
                    <span style="cursor:pointer; color: #d0021b;" title="Mis Favoritos">❤️</span>
                    <a href="perfil.html" style="text-decoration: none; color: black;" title="Mi Perfil"><span id="icono-perfil">👤</span></a>
                    <span style="cursor:pointer;" id="icono-bolsa" title="Mi Bolsa">🛍️</span>
                    <span id="contador-carrito" class="cart-counter">0</span>
                </div>
            </div>
        </nav>
    </header>

    <main class="carrito-main">
        <div class="carrito-container">
            <h2>MIS FAVORITOS ❤️</h2>
            <p style="margin-bottom: 20px; font-weight: 600; font-size: 0.9rem;">Los artículos que te encantan, guardados en un solo lugar.</p>
            
            <!-- Aquí JavaScript inyectará los favoritos guardados -->
            <div class="grid-productos" id="contenedor-favoritos">
            </div>

            <div style="margin-top: 40px;">
                <button onclick="window.location.href='index.html'" class="btn-volver" style="width: 100%;">← Volver a la Tienda</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 FITSHARK. PARA FINES EDUCATIVOS DESARROLLADOR POR CRISTOBAL RIQUELME.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
