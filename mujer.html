<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FITSHARK - Mujeres</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="promo-bar">
            <p><u>Obtén un 10 % de descuento en tu primer pedido al suscribirte a nuestros correos</u></p>
        </div>
        <nav class="main-nav">
            <div class="nav-left">
                <a href="mujer.html" style="font-weight: 800; text-decoration: underline;">Mujeres</a>
                <a href="hombre.html">Hombre</a>
                <a href="accesorios.html">Accesorios</a>
            </div>
            <div class="nav-center">
                <a href="index.html" style="text-decoration: none; color: black;"><h1>FITSHARK</h1></a>
            </div>
            <div class="nav-right">
                <div class="search-bar">
                    <span class="icon">🔍</span>
                    <input type="text" id="buscador" placeholder="Busca 'leggings'...">
                </div>
                <div class="icons">
                    <span style="cursor:pointer;" id="icono-favoritos" onclick="window.location.href='favoritos.html'" title="Mis Favoritos">🤍</span>
                    <a href="perfil.html" style="text-decoration: none; color: black;" title="Mi Perfil"><span>👤</span></a>
                    <span style="cursor:pointer;" id="icono-bolsa" title="Mi Bolsa">🛍️</span>
                    <span id="contador-carrito" class="cart-counter">0</span>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="productos-destacados">
            <div class="section-header">
                <h2>SECCIÓN MUJERES</h2>
            </div>
            
            <div class="grid-productos" id="contenedor-productos">
                <!-- Producto Mujer 1 -->
                <article class="producto-card" data-nombre="leggings vital seamless">
                    <div class="img-container">
                        <span class="heart-icon">🤍</span>
                        <img src="https://images.unsplash.com/photo-1506629082955-511b1aa562c8?w=500&q=80" alt="Leggings">
                    </div>
                    <div class="producto-info">
                        <h3>Leggings Vital Seamless</h3>
                        <p class="precio">$45.990</p>
                            <select class="selector-talla" style="width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; font-size: 0.8rem; cursor: pointer;">
                        <option value="">Selecciona tu talla</option>
                        <option value="S">Talla S</option>
                        <option value="M">Talla M</option>
                        <option value="L">Talla L</option>
                        <option value="XL">Talla XL</option>
                    </select>
                        <button class="btn-agregar-carrito" data-nombre="Leggings Vital Seamless" data-precio="45990">Añadir a la bolsa</button>
                    </div>
                </article>

                <!-- Producto Mujer 2 -->
                <article class="producto-card" data-nombre="top deportivo cross back">
                    <div class="img-container">
                        <span class="heart-icon">🤍</span>
                        <img src="https://images.unsplash.com/photo-1606902965551-dce093cda6e7?w=500&q=80" alt="Top Deportivo">
                    </div>
                    <div class="producto-info">
                        <h3>Top Deportivo Cross Back</h3>
                        <p class="precio">$29.990</p>
                            <select class="selector-talla" style="width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; font-size: 0.8rem; cursor: pointer;">
                        <option value="">Selecciona tu talla</option>
                        <option value="S">Talla S</option>
                        <option value="M">Talla M</option>
                        <option value="L">Talla L</option>
                        <option value="XL">Talla XL</option>
                    </select>
                        <button class="btn-agregar-carrito" data-nombre="Top Deportivo Cross Back" data-precio="29990">Añadir a la bolsa</button>
                    </div>
                </article>
                      <!-- Producto 3 -->
                <article class="producto-card" data-nombre="short deportivo 5 inch">
                    <div class="img-container">
                        <span class="heart-icon">🤍</span>
                        <img src="https://images.unsplash.com/photo-1591195853828-11db59a44f6b?w=500&q=80" alt="Short 5 inch">
                    </div>
                    <div class="producto-info">
                        <h3>Short Deportivo Mujer"</h3>
                        <p class="precio">$29.990</p>
                          <select class="selector-talla" style="width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; font-size: 0.8rem; cursor: pointer;">
                        <option value="">Selecciona tu talla</option>
                        <option value="S">Talla S</option>
                        <option value="M">Talla M</option>
                        <option value="L">Talla L</option>
                        <option value="XL">Talla XL</option>
                    </select>
                        <button class="btn-agregar-carrito" data-nombre="Short Deportivo Mujer" data-precio="29990">Añadir a la bolsa</button>
                    </div>
                </article>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 FITSHARK. PARA FINES EDUCATIVOS.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
